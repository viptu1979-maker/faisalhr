<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>نظام الموارد البشرية — شركة فيصل منصور حجي وشركائه (ذ.م.م)</title>

<!-- PWA: يسمح بتثبيت التطبيق على الجوال (أندرويد وآيفون) -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3B2A1D" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="الموارد البشرية" />

<!-- فتح الاتصال بسيرفر قاعدة بيانات Firebase (Firestore) بدري -->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

<!-- كل المكتبات دي defer: تتحمّل بالخلفية بالتوازي من غير ما توقف رسم الصفحة،
     وتتنفذ بالترتيب ده بالظبط بعد ما المتصفح يخلص رسم الـ HTML -->
<script defer src="react.production.min.js"></script>
<script defer src="react-dom.production.min.js"></script>
<script defer src="firebase-app-compat.js"></script>
<script defer src="firebase-firestore-compat.js"></script>
<script defer src="email.min.js"></script>
<script defer src="app.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  @media print {
    @page { size: A4 landscape; margin: 12mm 10mm; }

    html, body {
      background: #fff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body * { visibility: hidden; }
    .print-section, .print-section * { visibility: visible; }
    .print-section {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      padding: 0;
      background: #fff !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .print-section table { overflow: visible !important; }
    .no-print { display: none !important; }

    /* رأس التقرير المطبوع: يحل محل شريط المتصفح (بدون رابط/تاريخ/رقم صفحة تلقائي) */
    .print-only-title {
      display: flex !important;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 17px;
      font-weight: 800;
      color: #3B2A1D;
      margin-bottom: 4px;
      padding-bottom: 10px;
      border-bottom: 2px solid #B8863B;
    }
    .print-only-title .print-brand {
      font-size: 11px;
      font-weight: 600;
      color: #8a7a63;
    }
    .print-only-meta {
      display: flex !important;
      justify-content: space-between;
      font-size: 10.5px;
      color: #8a7a63;
      margin: 6px 0 14px 0;
    }

    /* الجدول: حدود واضحة، تكرار الترويسة، منع قطع الصفوف بين الصفحات */
    .print-section table {
      width: 100% !important;
      min-width: 0 !important;
      border-collapse: collapse !important;
      font-size: 10px !important;
    }
    .print-section table thead { display: table-header-group; }
    .print-section table tr { page-break-inside: avoid; }
    .print-section table th,
    .print-section table td {
      border: 1px solid #D8CBAE !important;
      padding: 5px 7px !important;
      font-family: inherit !important;
    }
    .print-section table th {
      background: #EAE1CE !important;
    }

    /* تذييل رقم الصفحة داخل محتوى الطباعة نفسه (وليس تذييل المتصفح) */
    .print-footer-note {
      display: block !important;
      margin-top: 10px;
      font-size: 9.5px;
      color: #a3927a;
      text-align: left;
    }
  }
  .print-footer-note { display: none; }

  @keyframes pulse-save {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* على الشاشات الضيقة: تحويل الجداول العريضة (class="responsive-table") إلى كروت رأسية
     بدل التمرير الأفقي — كل صف يبقى كارت مستقل وكل عمود يظهر كسطر "تسمية: قيمة" */
  @media (max-width: 860px) {
    .responsive-table-wrap { overflow: visible !important; }
    .responsive-table { min-width: 0 !important; }
    .responsive-table thead { display: none; }
    .responsive-table, .responsive-table tbody, .responsive-table tr, .responsive-table td {
      display: block;
      width: 100% !important;
    }
    .responsive-table tr {
      border-top: 1px solid #E4D9C4 !important;
      padding: 10px 12px;
    }
    .responsive-table tbody tr:first-child { border-top: none !important; }
    .responsive-table td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding: 6px 2px !important;
      border: none !important;
      text-align: right;
      position: static !important;
      box-shadow: none !important;
      background: transparent !important;
    }
    .responsive-table td::before {
      content: attr(data-label);
      font-weight: 700;
      color: #8a7a63;
      font-size: 11px;
      flex-shrink: 0;
    }
    .responsive-table td > * { min-width: 0; }
  }
</style></head>
<body>
<div id="root">
  <div id="hr-loading-shell" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;background:#FBF8F2;padding:20px;text-align:center;">
    <div id="hr-spinner" style="width:42px;height:42px;border:4px solid #E4D9C4;border-top-color:#B8863B;border-radius:50%;animation:hr-spin 0.8s linear infinite;"></div>
    <div id="hr-loading-text" style="color:#8a7a63;font-size:14px;font-weight:600;">جاري تحميل النظام…</div>
    <div id="hr-error-box" style="display:none;flex-direction:column;align-items:center;gap:10px;">
      <div style="color:#a3302e;font-size:14px;font-weight:700;">تعذّر تحميل النظام</div>
      <div style="color:#8a7a63;font-size:12.5px;max-width:320px;line-height:1.6;">
        غالبًا بسبب ضعف الاتصال بالإنترنت أو انقطاعه أثناء تحميل الصفحة. تأكد من الاتصال وحاول تاني.
      </div>
      <button onclick="location.reload()" style="margin-top:4px;padding:9px 22px;border:none;border-radius:8px;background:#B8863B;color:#fff;font-size:13px;font-weight:700;cursor:pointer;">
        إعادة المحاولة
      </button>
    </div>
  </div>
</div>
<style>
  @keyframes hr-spin { to { transform: rotate(360deg); } }
</style>
<script>
  /* لو التطبيق ما اتحملش خلال ١٢ ثانية (مكتبة خارجية فشلت/الاتصال بطيء جدًا)،
     نستبدل السبينر برسالة خطأ واضحة بدل ما تفضل الشاشة عالقة من غير تفسير */
  window.__hrLoadWatchdog = setTimeout(function () {
    var root = document.getElementById("root");
    var stillEmpty = root && root.querySelector("#hr-loading-shell");
    if (stillEmpty) {
      document.getElementById("hr-spinner").style.display = "none";
      document.getElementById("hr-loading-text").style.display = "none";
      document.getElementById("hr-error-box").style.display = "flex";
    }
  }, 12000);
</script>

<!-- تسجيل Service Worker عشان يشتغل التطبيق كـ PWA قابل للتثبيت على الجوال -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
