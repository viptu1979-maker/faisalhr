<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3B2A1D" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  @media print {
    @page { size: A4 landscape; margin: 12mm 10mm; }

    html, body {
      background: #fff !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body * { visibility: hidden; }
    .print-section, .print-section * { visibility: visible; }
    .print-section {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      padding: 0;
      background: #fff !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .print-section table { overflow: visible !important; }
    .no-print { display: none !important; }

    /* رأس التقرير المطبوع: يحل محل شريط المتصفح (بدون رابط/تاريخ/رقم صفحة تلقائي) */
    .print-only-title {
      display: flex !important;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-size: 17px;
      font-weight: 800;
      color: #3B2A1D;
      margin-bottom: 4px;
      padding-bottom: 10px;
      border-bottom: 2px solid #B8863B;
    }
    .print-only-title .print-brand {
      font-size: 11px;
      font-weight: 600;
      color: #8a7a63;
    }
    .print-only-meta {
      display: flex !important;
      justify-content: space-between;
      font-size: 10.5px;
      color: #8a7a63;
      margin: 6px 0 14px 0;
    }

    /* الجدول: حدود واضحة، تكرار الترويسة، منع قطع الصفوف بين الصفحات */
    .print-section table {
      width: 100% !important;
      min-width: 0 !important;
      border-collapse: collapse !important;
      font-size: 10px !important;
    }
    .print-section table thead { display: table-header-group; }
    .print-section table tr { page-break-inside: avoid; }
    .print-section table th,
    .print-section table td {
      border: 1px solid #D8CBAE !important;
      padding: 5px 7px !important;
      font-family: inherit !important;
    }
    .print-section table th {
      background: #EAE1CE !important;
    }

    /* تذييل رقم الصفحة داخل محتوى الطباعة نفسه (وليس تذييل المتصفح) */
    .print-footer-note {
      display: block !important;
      margin-top: 10px;
      font-size: 9.5px;
      color: #a3927a;
      text-align: left;
    }
  }
  .print-footer-note { display: none; }

  @keyframes pulse-save {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* على الشاشات الضيقة: تحويل الجداول العريضة (class="responsive-table") إلى كروت رأسية
     بدل التمرير الأفقي — كل صف يبقى كارت مستقل وكل عمود يظهر كسطر "تسمية: قيمة" */
  @media (max-width: 860px) {
    .responsive-table-wrap { overflow: visible !important; }
    .responsive-table { min-width: 0 !important; }
    .responsive-table thead { display: none; }
    .responsive-table, .responsive-table tbody, .responsive-table tr, .responsive-table td {
      display: block;
      width: 100% !important;
    }
    .responsive-table tr {
      border-top: 1px solid #E4D9C4 !important;
      padding: 10px 12px;
    }
    .responsive-table tbody tr:first-child { border-top: none !important; }
    .responsive-table td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding: 6px 2px !important;
      border: none !important;
      text-align: right;
      position: static !important;
      box-shadow: none !important;
      background: transparent !important;
    }
    .responsive-table td::before {
      content: attr(data-label);
      font-weight: 700;
      color: #8a7a63;
      font-size: 11px;
      flex-shrink: 0;
    }
    .responsive-table td > * { min-width: 0; }
  }
</style>
</head>

<div id="root"></div>

</script>

</html>
